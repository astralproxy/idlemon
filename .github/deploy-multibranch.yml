name: Deploy Multiple Branches to GitHub Pages

on:
  push:
    # Trigger on any branch push (adjust if you want to limit this)
    branches:
      - '**' 

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: Insert your custom build process here if needed (e.g., npm run build)
      # For a basic static site, we can just create/copy files to a build directory.
      - name: Prepare static files
        run: |
          mkdir -p dist
          cp -r . dist/ || true 
          # Remove .git from the build folder to avoid nesting conflicts
          rm -rf dist/.git

      - name: Arrange multi-branch layout
        uses: coderefinery/gh-pages-multibranch@main
        with:
          directory: dist

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist