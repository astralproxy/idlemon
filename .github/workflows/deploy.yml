name: Deploy Multiple Branches to GitHub Pages

on:
  push:
    branches:
      - main
      - idle-souls
  # Explicitly ignore the gh-pages branch to prevent infinite loops
  # (or use branches-ignore: [gh-pages])

permissions:
  contents: write

jobs:
  build-and-deploy:
  # Use the branch name dynamically as the destination folder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Branch to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: ${{ github.ref_name }}
          enable_jekyll: false